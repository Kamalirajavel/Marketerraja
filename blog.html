<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growth Insights | Marketer Raja Blog</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --cyan: #00f5ff; --pink: #ff0080; --green: #00ff88;
      --bg: #000c24; --bg2: #021233; --border: rgba(0,245,255,0.15);
      --white: #e8f4ff; --muted: rgba(232,244,255,0.45);
      --font-d: 'Orbitron', monospace; --font-m: 'Share Tech Mono', monospace; --font-u: 'Rajdhani', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--white); font-family: var(--font-u); overflow-x: hidden; }

    /* Nav */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 16px 5vw; background: rgba(0,12,36,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-d); font-size: 20px; font-weight: 900; color: var(--cyan); letter-spacing: 2px; white-space: nowrap; }
    .nav-logo span { color: var(--pink); }
    .nav-links { display: flex; gap: 30px; align-items: center; }
    .nav-links a { font-family: var(--font-m); font-size: 14px; letter-spacing: 2px; color: var(--white); text-decoration: none; text-transform: uppercase; transition: color 0.3s; }
    .nav-links a:hover { color: var(--cyan); }
    .nav-wa { display: flex; align-items: center; gap: 8px; background: rgba(37,211,102,0.1); border: 1px solid rgba(37,211,102,0.4); color: #25D366; font-family: var(--font-d); font-size: 12px; padding: 10px 20px; text-decoration: none; clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%); }

    /* Blog Header */
    .blog-header { text-align: center; padding: 140px 5vw 60px; }
    .blog-header h1 { font-family: var(--font-d); font-size: 50px; text-transform: uppercase; }
    .blog-header h1 span { color: var(--green); }
    
    /* Blog Grid */
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; padding: 0 5vw 100px; max-width: 1200px; margin: auto; }
    .blog-card { background: rgba(2,18,51,0.6); border: 1px solid var(--border); display: flex; flex-direction: column; transition: all 0.3s; cursor: pointer; }
    .blog-card:hover { transform: translateY(-10px); border-color: var(--green); }
    .b-thumb { width: 100%; height: 200px; object-fit: cover; }
    .b-content { padding: 25px; flex-grow: 1; }
    .b-meta { font-size: 11px; color: var(--green); margin-bottom: 10px; text-transform: uppercase; }
    .b-title { font-family: var(--font-d); font-size: 20px; margin-bottom: 15px; }
    .b-readmore { color: var(--cyan); font-size: 12px; letter-spacing: 2px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: flex-start; z-index: 1000; overflow-y: auto; padding: 40px 5vw; }
    .modal-content { background: var(--bg2); width: 100%; max-width: 800px; border: 1px solid var(--cyan); padding: 40px; position: relative; }
    .close-btn { position: absolute; top: 20px; right: 20px; color: var(--pink); font-size: 30px; cursor: pointer; border: none; background: none; }
    .m-body { line-height: 1.8; color: #ddd; margin-top: 20px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <img src="logo.jpg" style="height:44px; width:44px; object-fit:contain; border-radius:6px;" />
    <span style="color: #00f5ff;">MARKETER <span style="color: #ff0080;">RAJA</span></span>
  </div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="blog.html" style="color: var(--cyan);">Blog</a>
  </div>
  <a class="nav-wa" href="https://wa.me/+918489486025" target="_blank"><i class="fab fa-whatsapp"></i> FREE CALL</a>
</nav>

<header class="blog-header">
  <h1>Growth <span>Insights</span></h1>
  <p>Strategies on Lead Generation, Ads, and SEO.</p>
</header>

<div class="blog-grid" id="blog-container">
  <p style="text-align: center; color: var(--cyan); grid-column: 1 / -1;">Initializing Data...</p>
</div>

<div class="modal-overlay" id="post-modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">×</button>
    <h2 id="m-title" style="font-family: var(--font-d);"></h2>
    <img src="" id="m-thumb" style="width:100%; height:auto; margin:20px 0;">
    <div class="m-body" id="m-body"></div>
  </div>
</div>

<script type="module">
  import { db } from "./firebase-config.js";
  import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  window.blogPosts = [];

  async function loadBlog() {
    const container = document.getElementById('blog-container');
    const q = query(collection(db, "blog"), orderBy("timestamp", "desc"));
    const snapshot = await getDocs(q);
    container.innerHTML = '';
    
    snapshot.forEach((doc, i) => {
      const data = doc.data();
      window.blogPosts.push(data);
      container.innerHTML += `
        <div class="blog-card" onclick="openModal(${i})">
          <img src="${data.thumbnail}" class="b-thumb">
          <div class="b-content">
            <div class="b-meta">${data.author}</div>
            <h2 class="b-title">${data.title}</h2>
            <span class="b-readmore">READ PROTOCOL →</span>
          </div>
        </div>`;
    });
  }
  loadBlog();
</script>

<script>
  function openModal(i) {
    const post = window.blogPosts[i];
    document.getElementById('m-title').textContent = post.title;
    document.getElementById('m-thumb').src = post.thumbnail;
    document.getElementById('m-body').innerHTML = post.content;
    document.getElementById('post-modal').style.display = 'flex';
  }
  function closeModal() { document.getElementById('post-modal').style.display = 'none'; }
</script>

</body>
</html>
