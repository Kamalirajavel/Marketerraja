    const CUSTOMER_ID = "C-EFAF652FF33847B";
    // Paste your exact Message Central Auth Token string here directly
    const AUTH_TOKEN = "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJDLUVGQUY2NTJGRjMzODQ3QiIsImlhdCI6MTc4NTAwMDUzNiwiZXhwIjoxOTQyNjgwNTM2fQ.-b51wgiDyhq8bHM_cjDGywpb-bViOlotOms3t8qKBmFahekB_H1js6a0IcFmrsnLrWsfOgilRf2w3fppqmA4JQ"; 

    let savedVerificationId = null;
    const statusMsg = document.getElementById('status-msg');

    // 1. Send OTP Request (Direct Call)
    document.getElementById('send-otp-btn').addEventListener('click', async () => {
      const phone = document.getElementById('user-phone').value;
      if (phone.length !== 10) {
        statusMsg.style.color = "#ff0080";
        statusMsg.innerText = "Please enter a valid 10-digit mobile number.";
        return;
      }

      statusMsg.style.color = "#00f5ff";
      statusMsg.innerText = "Sending OTP...";

      try {
        const sendUrl = `https://cpaas.messagecentral.com/verification/v3/send?country=91&flowType=SMS&mobileNumber=${phone}&customerId=${CUSTOMER_ID}&otpLength=6`;
        
        const response = await fetch(sendUrl, {
          method: 'POST',
          headers: { 
            'authToken': AUTH_TOKEN,
            'accept': '*/*' 
          }
        });
        
        const result = await response.json();

        if (result.responseCode === 200 || result.status === "SUCCESS") {
          savedVerificationId = result.data.verificationId;
          document.getElementById('phone-step').style.display = 'none';
          document.getElementById('otp-step').style.display = 'block';
          statusMsg.innerText = "";
        } else {
          statusMsg.style.color = "#ff0080";
          statusMsg.innerText = result.message || "Failed to send OTP. Check token or credits.";
        }
      } catch (err) {
        console.error(err);
        statusMsg.style.color = "#ff0080";
        statusMsg.innerText = "Network request failed. Browser blocked direct call.";
      }
    });

    // 2. Validate OTP Request
    document.getElementById('verify-otp-btn').addEventListener('click', async () => {
      const code = document.getElementById('otp-input').value;
      const phone = document.getElementById('user-phone').value;

      if (code.length !== 4) {
        statusMsg.style.color = "#ff0080";
        statusMsg.innerText = "Please enter the 4-digit code.";
        return;
      }

      statusMsg.style.color = "#00f5ff";
      statusMsg.innerText = "Verifying code...";

      try {
        const validateUrl = `https://cpaas.messagecentral.com/verification/v3/validateOtp?country=91&mobileNumber=${phone}&verificationId=${savedVerificationId}&code=${code}`;
        
        const response = await fetch(validateUrl, {
          method: 'GET',
          headers: { 
            'authToken': AUTH_TOKEN,
            'accept': '*/*' 
          }
        });
        
        const result = await response.json();

        if (result.responseCode === 200 && result.data.verificationStatus === "VERIFICATION_COMPLETED") {
          document.getElementById('otp-step').style.display = 'none';
          statusMsg.style.color = "#00ff88";
          statusMsg.innerText = "SUCCESS! Phone number verified.";
        } else {
          statusMsg.style.color = "#ff0080";
          statusMsg.innerText = "Invalid OTP. Please try again.";
        }
      } catch (err) {
        console.error(err);
        statusMsg.style.color = "#ff0080";
        statusMsg.innerText = "Verification network error.";
      }
    });
