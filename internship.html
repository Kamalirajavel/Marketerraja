<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification | Marketer Raja</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&family=Rajdhani:wght@500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Rajdhani', sans-serif; background: #000c24; color: #e8f4ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .portal-box { background: rgba(2, 18, 51, 0.9); padding: 40px; border: 1px solid #00f5ff; border-radius: 8px; box-shadow: 0 0 30px rgba(0, 245, 255, 0.15); width: 100%; max-width: 400px; }
    h2 { font-family: 'Orbitron', monospace; color: #00f5ff; text-align: center; margin-bottom: 25px; letter-spacing: 2px; }
    input { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,245,255,0.3); color: #fff; border-radius: 4px; box-sizing: border-box; outline: none; font-family: 'Share Tech Mono', monospace; }
    input:focus { border-color: #00f5ff; }
    button { width: 100%; padding: 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: 'Orbitron', monospace; transition: 0.3s; margin-bottom: 10px; }
    .btn-primary { background: #25D366; color: #fff; box-shadow: 0 4px 15px rgba(37,211,102,0.3); }
    .btn-primary:hover { background: #20b958; transform: translateY(-2px); }
    .btn-secondary { background: #00f5ff; color: #000; box-shadow: 0 4px 15px rgba(0,245,255,0.3); }
    .btn-secondary:hover { background: #00c2cc; transform: translateY(-2px); }
    #status-msg { text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 13px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="portal-box">
    <h2>PHONE VERIFICATION</h2>
    
    <!-- Step 1: Input Phone Number & Firebase reCAPTCHA -->
    <div id="phone-step">
      <input type="tel" id="phone-input" placeholder="Enter 10-digit mobile number" maxlength="10" required>
      
      <!-- REQUIRED: Firebase reCAPTCHA widget container -->
      <div id="recaptcha-container" style="margin-bottom: 15px;"></div>

      <button id="send-otp-btn" class="btn-primary">SEND OTP</button>
    </div>

    <!-- Step 2: Input OTP Code -->
    <div id="otp-step" style="display: none;">
      <p style="text-align: center; color: #00ff88; font-size: 14px; margin-bottom: 15px;">OTP sent successfully via Firebase!</p>
      <input type="text" id="otp-input" placeholder="Enter 6-digit OTP" maxlength="6" required>
      <button id="verify-otp-btn" class="btn-secondary">VERIFY OTP</button>
    </div>

    <div id="status-msg"></div>
  </div>

  <!-- Firebase Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA0JCQDUZ9slUeA3REIPN0poCuMWy55uFc",
      authDomain: "marketerraja-d4054.firebaseapp.com",
      projectId: "marketerraja-d4054",
      storageBucket: "marketerraja-d4054.firebasestorage.app",
      messagingSenderId: "1089812986562",
      appId: "1:1089812986562:web:964fbb3cda2b0ee4aad95b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const statusMsg = document.getElementById('status-msg');

    // Initialize reCAPTCHA verifier on window load
    window.addEventListener('DOMContentLoaded', () => {
      window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
        'size': 'normal',
        'callback': (response) => {
          // reCAPTCHA solved
        },
        'expired-callback': () => {
          statusMsg.style.color = "#ff0080";
          statusMsg.innerText = "reCAPTCHA expired. Please solve it again.";
        }
      });
      
      window.recaptchaVerifier.render();
    });

    // 1. Send OTP using Firebase
    document.getElementById("send-otp-btn").addEventListener("click", () => {
      const rawPhoneNumber = document.getElementById("phone-input").value;
      if (rawPhoneNumber.length !== 10) {
        statusMsg.style.color = "#ff0080";
        statusMsg.innerText = "Please enter a valid 10-digit mobile number.";
        return;
      }

      const phoneNumber = "+91" + rawPhoneNumber;
      const appVerifier = window.recaptchaVerifier;

      statusMsg.style.color = "#00f5ff";
      statusMsg.innerText = "Sending OTP...";

      signInWithPhoneNumber(auth, phoneNumber, appVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          document.getElementById('phone-step').style.display = 'none';
          document.getElementById('otp-step').style.display = 'block';
          statusMsg.innerText = "";
        })
        .catch((error) => {
          console.error("Error sending OTP:", error);
          statusMsg.style.color = "#ff0080";
          statusMsg.innerText = "Failed to send OTP. Check console/authorized domains.";
        });
    });

    // 2. Verify OTP using Firebase
    document.getElementById("verify-otp-btn").addEventListener("click", () => {
      const code = document.getElementById("otp-input").value;
      if (!code || code.length < 6) {
        statusMsg.style.color = "#ff0080";
        statusMsg.innerText = "Please enter the complete 6-digit code.";
        return;
      }

      statusMsg.style.color = "#00f5ff";
      statusMsg.innerText = "Verifying code...";

      window.confirmationResult.confirm(code)
        .then((result) => {
          const user = result.user;
          document.getElementById('otp-step').style.display = 'none';
          statusMsg.style.color = "#00ff88";
          statusMsg.innerText = "SUCCESS! Phone number verified.";
          console.log("Verified user:", user);
        })
        .catch((error) => {
          console.error("Invalid OTP code:", error);
          statusMsg.style.color = "#ff0080";
          statusMsg.innerText = "Invalid OTP. Please try again.";
        });
    });
  </script>
</body>
</html>
