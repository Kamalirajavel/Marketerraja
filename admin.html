<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Marketer Raja</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000c24; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-box { background: #021233; padding: 40px; border-radius: 8px; border: 1px solid #00f5ff; box-shadow: 0 0 20px rgba(0,245,255,0.2); width: 100%; max-width: 320px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid rgba(0,245,255,0.3); border-radius: 4px; box-sizing: border-box; background: rgba(0,0,0,0.5); color: white; outline: none; }
    button { width: 100%; padding: 12px; background: #00f5ff; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
    button:hover { background: #00c2cc; }
    .hidden { display: none; }
    
    /* Dashboard Styles */
    .dashboard-box { background: #021233; padding: 30px; border-radius: 8px; border: 1px solid #00f5ff; width: 95%; max-width: 1000px; margin: 40px auto; align-self: flex-start; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,245,255,0.2); padding-bottom: 15px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0,0,0,0.3); }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(0,245,255,0.1); }
    th { background: rgba(0,245,255,0.1); color: #00f5ff; }
    td { color: #e8f4ff; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #25D366; color: #000; }
  </style>
</head>
<body>

  <!-- Login Form -->
  <div id="login-section" class="login-box">
    <h2 style="color: #00f5ff; margin-bottom: 20px;">SYSTEM LOGIN</h2>
    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">ACCESS TERMINAL</button>
    <p id="error-msg" style="color: #ff0080; font-size: 14px; margin-top: 15px;"></p>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-dashboard" class="dashboard-box hidden">
    <div class="header">
      <h2 style="color: #00f5ff; margin: 0;">MARKETER RAJA // ADMIN CONSOLE</h2>
      <button id="logout-btn" style="width: auto; background: #ff0080; color: white;">LOG OUT</button>
    </div>
    
    <h3 style="color: #ffd700;">Recent Client Enquiries</h3>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Service Requested</th>
          <th>Budget</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="enquiry-list">
        <tr><td colspan="6" style="text-align: center;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA0JCQDUZ9slUeA3REIPN0poCuMWy55uFc",
      authDomain: "marketerraja-d4054.firebaseapp.com",
      projectId: "marketerraja-d4054",
      storageBucket: "marketerraja-d4054.firebasestorage.app",
      messagingSenderId: "1089812986562",
      appId: "1:1089812986562:web:964fbb3cda2b0ee4aad95b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginSection = document.getElementById('login-section');
    const adminDashboard = document.getElementById('admin-dashboard');
    const errorMsg = document.getElementById('error-msg');

    // Login Logic
    document.getElementById('login-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      errorMsg.textContent = "Authenticating...";
      
      signInWithEmailAndPassword(auth, email, password).catch((error) => {
        errorMsg.textContent = "Access Denied. Invalid credentials.";
      });
    });

    // Logout Logic
    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth).then(() => {
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        errorMsg.textContent = '';
      });
    });

    // Fetch Database Data
    const fetchEnquiries = async () => {
      try {
        const q = query(collection(db, "enquiries"), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);
        const list = document.getElementById('enquiry-list');
        list.innerHTML = ''; 
        
        if (querySnapshot.empty) {
          list.innerHTML = '<tr><td colspan="6" style="text-align: center;">No enquiries yet.</td></tr>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const date = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString() : 'Just now';
          
          list.innerHTML += `
            <tr>
              <td>${date}</td>
              <td style="font-weight: bold;">${data.name}</td>
              <td>${data.contact}</td>
              <td style="color: #00f5ff;">${data.service}</td>
              <td style="color: #00ff88;">${data.budget}</td>
              <td><span class="badge">${data.status}</span></td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
        document.getElementById('enquiry-list').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ff0080;">Error loading data. Check Firestore rules.</td></tr>';
      }
    };

    // Monitor Auth State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add('hidden');
        adminDashboard.classList.remove('hidden');
        fetchEnquiries(); // Load the table when logged in
      } else {
        loginSection.classList.remove('hidden');
        adminDashboard.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
