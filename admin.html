<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Marketer Raja</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000c24; color: #fff; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
    .login-box { background: #021233; padding: 40px; border-radius: 8px; border: 1px solid #00f5ff; box-shadow: 0 0 20px rgba(0,245,255,0.2); width: 100%; max-width: 350px; text-align: center; margin: auto; }
    button { width: 100%; padding: 12px; background: #00f5ff; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.3s; }
    button:hover { background: #00c2cc; }
    .hidden { display: none; }
    .dashboard-box { background: #021233; padding: 30px; border-radius: 8px; border: 1px solid #00f5ff; width: 95%; max-width: 1100px; margin: 40px auto; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,245,255,0.2); padding-bottom: 15px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(0,0,0,0.3); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(0,245,255,0.1); color: #e8f4ff; }
    th { background: rgba(0,245,255,0.1); color: #00f5ff; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid rgba(0,245,255,0.3); border-radius: 4px; box-sizing: border-box; background: rgba(0,0,0,0.5); color: white; outline: none; }
    .metric-row { display: flex; gap: 10px; margin-bottom: 5px; }
    .action-btn { padding: 6px 12px; font-size: 12px; margin: 2px; width: auto;}
    .del-btn { background: #ff0080; color: white; }
    .edit-btn { background: #ffd700; color: black; }
  </style>
</head>
<body>

  <!-- Google Auth Login -->
  <div id="login-section" class="login-box">
    <h2 style="color: #00f5ff; margin-bottom: 20px;">SYSTEM LOGIN</h2>
    <p style="color: #ccc; font-size: 14px; margin-bottom: 20px;">Secured by Google Auth</p>
    <button id="google-login-btn" style="background: white; color: black;">
      <img src="https://developers.google.com/identity/images/g-logo.png" style="width: 18px; vertical-align: middle; margin-right: 8px;"> 
      Sign in with Google
    </button>
    <p id="error-msg" style="color: #ff0080; font-size: 14px; margin-top: 15px;"></p>
  </div>

  <!-- Dashboard -->
  <div id="admin-dashboard" class="dashboard-box hidden">
    <div class="header">
      <h2 style="color: #00f5ff; margin: 0;">MARKETER RAJA // ADMIN CONSOLE</h2>
      <button id="logout-btn" style="width: auto; background: #ff0080; color: white;">LOG OUT</button>
    </div>
    
    <!-- Enquiries -->
    <h3 style="color: #ffd700;">Recent Client Enquiries</h3>
    <div style="overflow-x: auto; margin-bottom: 40px;">
      <table>
        <thead><tr><th>Date</th><th>Name</th><th>Contact</th><th>Service</th><th>Budget</th></tr></thead>
        <tbody id="enquiry-list"><tr><td colspan="5" style="text-align: center;">Loading data...</td></tr></tbody>
      </table>
    </div>

    <!-- Manage Portfolio -->
    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
      
      <!-- Portfolio Form -->
      <div style="flex: 1; min-width: 300px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,0,128,0.3);">
        <h3 id="form-title" style="color: #ff0080; margin-top: 0;">+ Add New Portfolio Item</h3>
        <form id="portfolio-form">
          <input type="hidden" id="pf-id"> <!-- Hidden ID for Editing -->
          
          <div style="display: flex; gap: 10px;">
            <input type="text" id="pf-name" placeholder="Client Name" required style="flex: 2;">
            <input type="text" id="pf-icon" placeholder="Icon (e.g. 🏢)" required style="flex: 1;">
          </div>
          <input type="text" id="pf-industry" placeholder="Industry (e.g. B2B)" required>
          <input type="number" id="pf-graph" placeholder="Graph Volume (Number for Donut Chart)" required>
          <input type="text" id="pf-status" placeholder="Status Badge (e.g. ACTIVE)" required>
          
          <h4 style="color: #00f5ff; margin-bottom: 5px;">Metrics</h4>
          <div id="metrics-container">
            <div class="metric-row">
              <input type="text" class="m-label" placeholder="Metric Label" required>
              <input type="text" class="m-value" placeholder="Metric Value" required>
            </div>
          </div>
          <button type="button" id="add-metric-btn" style="background: transparent; border: 1px dashed #00f5ff; color: #00f5ff; padding: 8px;">+ Add Another Metric</button>

          <button type="submit" id="save-pf-btn" style="background: #ff0080; color: white; margin-top: 20px;">SAVE PORTFOLIO</button>
        </form>
      </div>

      <!-- Portfolio List -->
      <div style="flex: 1; min-width: 300px;">
        <h3 style="color: #00ff88; margin-top: 0;">Manage Portfolio Elements</h3>
        <div style="overflow-x: auto;">
          <table>
            <thead><tr><th>Client</th><th>Volume</th><th>Actions</th></tr></thead>
            <tbody id="portfolio-list"><tr><td colspan="3">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script type="module">
    import { auth, provider, db } from "./firebase-config.js";
    import { signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
   import { collection, getDocs, orderBy, query, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    document.getElementById('google-login-btn').addEventListener('click', () => {
      document.getElementById('error-msg').textContent = "Authenticating...";
      signInWithPopup(auth, provider).catch(err => {
        document.getElementById('error-msg').textContent = "Google Sign-In failed.";
        console.error(err);
      });
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        fetchData();
      } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('admin-dashboard').classList.add('hidden');
      }
    });

    // Dynamic Metrics UI
    document.getElementById('add-metric-btn').addEventListener('click', () => {
      const container = document.getElementById('metrics-container');
      const row = document.createElement('div');
      row.className = 'metric-row';
      row.innerHTML = `<input type="text" class="m-label" placeholder="Metric Label" required> <input type="text" class="m-value" placeholder="Metric Value" required> <button type="button" class="action-btn del-btn" onclick="this.parentElement.remove()">X</button>`;
      container.appendChild(row);
    });

    // 1. Real-time Enquiries Listener
      onSnapshot(query(collection(db, "enquiries"), orderBy("timestamp", "desc")), (snapE) => {
        const listE = document.getElementById('enquiry-list');
        listE.innerHTML = '';
        snapE.forEach(d => {
          const data = d.data();
          listE.innerHTML += `<tr>
            <td>${data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString() : 'New'}</td>
            <td>${data.name}</td>
            <td>${data.contact}</td>
            <td>${data.service}</td>
            <td>${data.budget}</td>
          </tr>`;
        });
      });

      // 2. Fetch Portfolio List
      const qP = query(collection(db, "portfolio"), orderBy("timestamp", "desc"));
      const snapP = await getDocs(qP);
      const listP = document.getElementById('portfolio-list');
      listP.innerHTML = '';
      snapP.forEach(d => {
        const data = d.data();
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${data.name}</td>
          <td>${data.graphVolume}</td>
          <td>
            <button class="action-btn edit-btn" data-id="${d.id}">Edit</button>
            <button class="action-btn del-btn" data-id="${d.id}">Del</button>
          </td>
        `;
        listP.appendChild(tr);

        // Edit Button Logic
        tr.querySelector('.edit-btn').addEventListener('click', () => {
          document.getElementById('pf-id').value = d.id;
          document.getElementById('pf-name').value = data.name;
          document.getElementById('pf-icon').value = data.icon;
          document.getElementById('pf-industry').value = data.industry;
          document.getElementById('pf-graph').value = data.graphVolume;
          document.getElementById('pf-status').value = data.status;
          document.getElementById('form-title').textContent = "✏️ Edit Portfolio Item";
          document.getElementById('save-pf-btn').textContent = "UPDATE PORTFOLIO";
          
          // Load Metrics into form
          const container = document.getElementById('metrics-container');
          container.innerHTML = '';
          data.metrics.forEach(m => {
            const row = document.createElement('div');
            row.className = 'metric-row';
            row.innerHTML = `<input type="text" class="m-label" value="${m.label}" required> <input type="text" class="m-value" value="${m.value}" required> <button type="button" class="action-btn del-btn" onclick="this.parentElement.remove()">X</button>`;
            container.appendChild(row);
          });
        });

        // Delete Button Logic
        tr.querySelector('.del-btn').addEventListener('click', async () => {
          if(confirm("Are you sure you want to delete this project?")) {
            await deleteDoc(doc(db, "portfolio", d.id));
            fetchData();
          }
        });
      });
    }

    // Save/Update Portfolio Logic
    document.getElementById('portfolio-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-pf-btn');
      btn.textContent = "SAVING...";

      // Gather dynamic metrics
      const metrics = [];
      document.querySelectorAll('.metric-row').forEach(row => {
        const label = row.querySelector('.m-label').value;
        const value = row.querySelector('.m-value').value;
        if (label && value) metrics.push({ label, value });
      });

      const portfolioData = {
        name: document.getElementById('pf-name').value,
        icon: document.getElementById('pf-icon').value,
        industry: document.getElementById('pf-industry').value,
        graphVolume: document.getElementById('pf-graph').value,
        status: document.getElementById('pf-status').value.toUpperCase(),
        metrics: metrics,
        timestamp: serverTimestamp()
      };

      const editId = document.getElementById('pf-id').value;

      try {
       if (editId) {
          // Update existing: DO NOT delete the timestamp, 
          // just update the fields provided.
          await updateDoc(doc(db, "portfolio", editId), portfolioData);
        } else {
          // Add new
          await addDoc(collection(db, "portfolio"), portfolioData);
        }
        
        e.target.reset();
        document.getElementById('pf-id').value = '';
        document.getElementById('form-title').textContent = "+ Add New Portfolio Item";
        btn.textContent = "SAVE PORTFOLIO";
        document.getElementById('metrics-container').innerHTML = `<div class="metric-row"><input type="text" class="m-label" placeholder="Metric Label" required> <input type="text" class="m-value" placeholder="Metric Value" required></div>`;
        
        fetchData(); // Refresh list
      } catch (err) {
        alert("Error: " + err.message);
        btn.textContent = "SAVE PORTFOLIO";
      }
    });
  </script>
</body>
</html>
